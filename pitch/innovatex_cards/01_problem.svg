<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#06142e"/>
<circle cx="1770" cy="85" r="300" fill="#102958" opacity=".72"/><circle cx="1850" cy="120" r="210" fill="#244787" opacity=".24"/>
<g transform="translate(100 70) skewX(-18)"><rect width="12" height="55" rx="6" fill="#5f8dff"/><rect x="24" y="-17" width="12" height="72" rx="6" fill="#9b7cff"/><rect x="48" y="-42" width="12" height="97" rx="6" fill="#5f8dff"/></g>
<text x="190" y="95" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="27px" font-weight="800" text-anchor="start">SOVRIVA</text><text x="190" y="126" fill="#9fb1d2" font-family="Arial,Segoe UI,sans-serif" font-size="13px" font-weight="700" text-anchor="start">NEXUS INNOVATEX 2026  •  IDEA PITCH</text>
<text x="105" y="255" fill="#5f8dff" font-family="Arial,Segoe UI,sans-serif" font-size="21px" font-weight="800" text-anchor="start">01 / THE PROBLEM</text><text x="105" y="335" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="58px" font-weight="800" text-anchor="start">People can download data.</text><text x="105" y="401" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="58px" font-weight="800" text-anchor="start">Understanding is the hard part.</text><text x="105" y="430" fill="#9fb1d2" font-family="Arial,Segoe UI,sans-serif" font-size="27px" font-weight="400" text-anchor="start">The gap is not access. It is making exported evidence understandable, comparable and verifiable.</text>
<g transform="translate(105 570)"><rect width="500" height="220" rx="18" fill="#102a56" stroke="#ffb65c" stroke-opacity=".75"/>
<text x="28" y="50" fill="#ffb65c" font-family="Arial,Segoe UI,sans-serif" font-size="18px" font-weight="800" text-anchor="start">FRAGMENTED EXPORTS</text><text x="28" y="94" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="25px" font-weight="700" text-anchor="start">Different folders</text><text x="28" y="140" fill="#9fb1d2" font-family="Arial,Segoe UI,sans-serif" font-size="19px" font-weight="400" text-anchor="start">Labels and file structures vary across platforms.</text></g><g transform="translate(710 570)"><rect width="500" height="220" rx="18" fill="#102a56" stroke="#9b7cff" stroke-opacity=".75"/>
<text x="28" y="50" fill="#9b7cff" font-family="Arial,Segoe UI,sans-serif" font-size="18px" font-weight="800" text-anchor="start">NO TRUSTWORTHY HISTORY</text><text x="28" y="94" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="25px" font-weight="700" text-anchor="start">Missing ≠ deleted</text><text x="28" y="140" fill="#9fb1d2" font-family="Arial,Segoe UI,sans-serif" font-size="19px" font-weight="400" text-anchor="start">A later export may have incomplete coverage.</text></g><g transform="translate(1315 570)"><rect width="500" height="220" rx="18" fill="#102a56" stroke="#ef6d78" stroke-opacity=".75"/>
<text x="28" y="50" fill="#ef6d78" font-family="Arial,Segoe UI,sans-serif" font-size="18px" font-weight="800" text-anchor="start">DISCONNECTED TOOLS</text><text x="28" y="94" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="25px" font-weight="700" text-anchor="start">Blockers or viewers</text><text x="28" y="140" fill="#9fb1d2" font-family="Arial,Segoe UI,sans-serif" font-size="19px" font-weight="400" text-anchor="start">Users still need one evidence-led workflow.</text></g></svg>