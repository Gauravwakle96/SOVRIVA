<text x="105" y="255" fill="#5f8dff" font-family="Arial,Segoe UI,sans-serif" font-size="21px" font-weight="800" text-anchor="start">THE PROMISE</text><text x="105" y="335" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="58px" font-weight="800" text-anchor="start">Understand the profile.</text><text x="105" y="401" fill="#f3f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="58px" font-weight="800" text-anchor="start">Trace the evidence. Verify the change.</text><text x="105" y="430" fill="#9fb1d2" font-family="Arial,Segoe UI,sans-serif" font-size="27px" font-weight="400" text-anchor="start">SOVRIVA is not a claim to know everything about a user. It is a practical path to accessible evidence.</text>
